<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">LibraDesk — Your books. Your space.</title>
  <desc id="desc">A local PDF library for Windows, illustrated with books on a reading desk.</desc>
